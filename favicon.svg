<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <!-- gold arm, running from the core outward -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="1" stop-color="#e0ac1a"/>
    </linearGradient>
    <!-- violet arm (same shape, rotated half a turn) -->
    <linearGradient id="violet" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#e21cff"/>
      <stop offset="1" stop-color="#6a1bff"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6d661"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#24123d"/>
  <!-- Both arms start exactly at the centre (32,32) and the core sits on top, so nothing pokes out -->
  <g transform="translate(32 32) rotate(2) scale(.86) translate(-32 -32)" fill="none" stroke-linecap="round">
    <path d="M32 32 C25 32 21 26 27 21 C36 14 53 17 59 27" stroke="url(#gold)" stroke-width="6.5"/>
    <path d="M32 32 C25 32 21 26 27 21 C36 14 53 17 59 27" stroke="url(#violet)" stroke-width="6.5" transform="rotate(180 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="4.6" fill="url(#core)"/>
</svg>
